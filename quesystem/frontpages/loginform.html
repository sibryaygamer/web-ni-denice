<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLMUN Registrar System Login</title>
    <link rel="stylesheet" href="loginform.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Full-screen Background Overlay -->
    <div class="bg-overlay"></div>

    <!-- Centered Login Card with Gold Outline -->
    <div class="login-card highlight-gold-card" style="border: 2px solid var(--gold, #E0A100) !important;">
        <!-- Header Brand Section -->
        <div class="card-header">
            <img src="plmunlogo.png" alt="PLMUN Logo" class="login-logo">
            <h2 id="portalTitle">PLMUN Student Portal</h2>
            <p>Queue and Appointment System</p>
        </div>

        <!-- Student / Admin Role Tabs -->
        <div class="tab-navigation">
            <button type="button" class="tab-btn active" id="studentTabBtn" onclick="switchTab('student')">
                <i class="fa-solid fa-user-graduate"></i> Student
            </button>
            <button type="button" class="tab-btn" id="adminTabBtn" onclick="switchTab('admin')">
                <i class="fa-solid fa-user-shield"></i> Admin
            </button>
        </div>

        <!-- Form Section -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <!-- Username / ID Field -->
            <div class="input-group">
                <label id="idLabel" for="username">Student Number</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="username" placeholder="Enter Student Number" required>
                </div>
            </div>

            <!-- Password / PIN Field -->
            <div class="input-group">
                <label for="password">Password / PIN</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Enter Password" required>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn" id="submitBtn">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>

        <!-- Dynamic Footer Registration Link -->
        <div class="card-footer">
            <p>Don't have an account? <a href="studentregistration.html" id="registerLink">Register here</a></p>
        </div>
    </div>

    <!-- Tab Switcher Script -->
    <script>
        let currentRole = 'student';

        function switchTab(role) {
            currentRole = role;
            const studentBtn = document.getElementById('studentTabBtn');
            const adminBtn = document.getElementById('adminTabBtn');
            const portalTitle = document.getElementById('portalTitle');
            const idLabel = document.getElementById('idLabel');
            const usernameInput = document.getElementById('username');
            const registerLink = document.getElementById('registerLink');

            if (role === 'student') {
                studentBtn.classList.add('active');
                adminBtn.classList.remove('active');
                portalTitle.textContent = 'PLMUN Student Portal';
                idLabel.textContent = 'Student Number';
                usernameInput.placeholder = 'Enter Student Number';
                registerLink.href = 'studentregistration.html';
            } else {
                adminBtn.classList.add('active');
                studentBtn.classList.remove('active');
                portalTitle.textContent = 'PLMUN Admin Portal';
                idLabel.textContent = 'Admin Username / Email';
                usernameInput.placeholder = 'Enter Admin Account';
                registerLink.href = 'adminregistration.html';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            if (currentRole === 'admin') {
                window.location.href = '../admin/admindashboard.html';
            } else {
                window.location.href = '../student/studentdashboard.html';
            }
        }
    </script>
</body>
</html>
